[package]
name = "mc_pvp_sim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

# Release profile tuned for max steps/sec during training.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
rayon = "1"
socket2 = "0.6"
